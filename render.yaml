# Render blueprint — deploys the backend API.
#
# The frontend goes to Vercel separately; see DEPLOY.md.
#
# Render's disk is ephemeral, so the database is rebuilt on every boot. That is
# safe here precisely because the dataset is deterministic: SEED and SEED_NOW pin
# it, so every boot regenerates the identical 80-case book and the same headline
# numbers. Committed narration is replayed on top, so the deploy shows LLM prose
# without making a single API call during startup.
services:
  - type: web
    name: revenue-recovery-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm run demo && npm run start:backend
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SEED
        value: "20260829"
      - key: SEED_NOW
        value: "2026-08-29T18:00:00+05:30"
      - key: LLM_PROVIDER
        value: groq
      # Set these two in the Render dashboard, not here.
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
